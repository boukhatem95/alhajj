<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F3D33">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الحاج">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="الحاج: إدارة المال والديون والمهام والعادات والأهداف في تطبيق واحد.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>الحاج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>[hidden]{display:none!important}
:root{
  color-scheme:light;
  --bg:#F1F3EF; --surface:#FFFFFF; --surface2:#E8ECE6; --field:#F7F8F5;
  --fg:#16211D; --muted:#55655F; --line:#D3DAD2;
  --brand:#0F3D33; --on-brand:#F3F7F3; --brand-muted:#A9C2B8;
  --gold:#C99A2E; --on-gold:#2A1F05; --link:#0F5A49;
  --pos:#11704A; --pos-bg:#DCEFE3; --neg:#B3361F; --neg-bg:#F7E0DA; --warn:#8F5A00; --warn-bg:#F6E8C8;
  --hero-pos:#8FE3B9; --hero-neg:#FFB4A3;
  --scrim:rgba(8,16,13,.5); --shadow:0 10px 30px rgba(15,61,51,.18);
  --c1:#0F7B5F; --c2:#B8862A; --c3:#2F6FB5; --c4:#B3361F; --c5:#7A4FB5; --c6:#0E8C99; --c7:#A63F7A; --c8:#6B7A74;
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --f-display:'Reem Kufi','IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --tabs-h:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1512; --surface:#16201C; --surface2:#1E2B26; --field:#111A16;
    --fg:#E8EFEA; --muted:#9AABA4; --line:#2B3A34;
    --brand:#123A30; --on-brand:#F1F7F3; --brand-muted:#9DBBB0;
    --gold:#E0B34A; --on-gold:#231A04; --link:#7FD8B4;
    --pos:#5FD39B; --pos-bg:#14352A; --neg:#FF8D78; --neg-bg:#3A1D17; --warn:#F0B955; --warn-bg:#3A2D10;
    --scrim:rgba(0,0,0,.62); --shadow:0 10px 30px rgba(0,0,0,.5);
    --c1:#5FD39B; --c2:#E0B34A; --c3:#6FA8E8; --c4:#FF8D78; --c5:#B79AF0; --c6:#4FD0DB; --c7:#E58AC0; --c8:#9AABA4;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1512; --surface:#16201C; --surface2:#1E2B26; --field:#111A16;
  --fg:#E8EFEA; --muted:#9AABA4; --line:#2B3A34;
  --brand:#123A30; --on-brand:#F1F7F3; --brand-muted:#9DBBB0;
  --gold:#E0B34A; --on-gold:#231A04; --link:#7FD8B4;
  --pos:#5FD39B; --pos-bg:#14352A; --neg:#FF8D78; --neg-bg:#3A1D17; --warn:#F0B955; --warn-bg:#3A2D10;
  --scrim:rgba(0,0,0,.62); --shadow:0 10px 30px rgba(0,0,0,.5);
  --c1:#5FD39B; --c2:#E0B34A; --c3:#6FA8E8; --c4:#FF8D78; --c5:#B79AF0; --c6:#4FD0DB; --c7:#E58AC0; --c8:#9AABA4;
}
*,*::before,*::after{box-sizing:border-box}
html{direction:rtl;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.65;direction:rtl;text-align:start;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:40}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,blockquote{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:100%;max-width:608px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;white-space:nowrap}
.cur{font-size:.82em;font-weight:500;color:var(--muted)}
.amt{white-space:nowrap}
.neg{color:var(--neg)} .pos{color:var(--pos)}
.mb{margin-bottom:12px} .mt{margin-top:10px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--brand);color:var(--on-brand)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;letter-spacing:.01em}
.brand-sub{font-size:12.5px;color:var(--gold);font-weight:600;margin-top:2px}
.top-actions{display:flex;gap:8px}
.top .icon-btn{background:rgba(255,255,255,.12);color:var(--on-brand)}
main{padding-block:16px calc(var(--tabs-h) + env(safe-area-inset-bottom,0px) + 104px)}
.stack{display:flex;flex-direction:column;gap:16px}

/* banners */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:11px 14px;border-radius:12px;font-size:13.5px;margin-bottom:12px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--line)}
.banner.info{background:var(--surface2);color:var(--fg)}
.banner p{flex:1 1 220px;min-width:0}
.banner button{background:transparent;border:1px solid currentColor;border-radius:8px;padding:4px 12px;font-weight:600;font-size:13px}

/* hero */
.hero{background:var(--brand);color:var(--on-brand);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.hero-k{font-size:13px;color:var(--brand-muted)}
.hero-name{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,8.5vw,34px);line-height:1.25;margin-top:2px;overflow-wrap:anywhere}
.hero-date{font-size:14px;margin-top:6px}
.hero-date2{font-size:13px;color:var(--gold);font-weight:600}
.hero-net{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,10vw,42px);line-height:1.2;margin-top:2px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hero-net .cur{color:var(--brand-muted);font-family:var(--f-body)}
.hero-hint{font-size:13px;color:var(--brand-muted)}
.hero-split{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-top:1px solid rgba(255,255,255,.16);padding-top:12px}
.hero-split>div{min-width:0;display:flex;flex-direction:column;gap:2px}
.hero-split>div+div{border-inline-start:1px solid rgba(255,255,255,.16);padding-inline-start:12px}
.hero-k2{font-size:12px;color:var(--brand-muted)}
.hero-v{font-weight:700;font-size:15.5px;line-height:1.35}
.hero-v .cur{color:var(--brand-muted)}
.hero-net.lowhero{color:var(--hero-neg)}
.hero-edit{background:none;border:0;color:var(--gold);font-weight:600;font-size:12.5px;padding:2px 0;text-align:start;display:flex;gap:4px;align-items:center}
.hero-edit svg{width:14px;height:14px}
.dhead{padding:6px 14px;background:var(--surface2);font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.quote{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--gold);border-radius:12px;padding:12px 14px}
.quote .k{font-size:12px;color:var(--muted);font-weight:600}
.quote p{font-size:15.5px;margin-top:2px}

/* cards, sections */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2,.sec-head h2{font-size:15px;font-weight:700}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.sec-head .count{color:var(--muted);font-weight:500;font-size:13px;margin-inline-start:6px}
.sec-total{font-weight:700;font-size:14.5px}
.sec-total.in{color:var(--pos)} .sec-total.out{color:var(--neg)}
.linkbtn{background:none;border:0;color:var(--link);font-weight:600;font-size:13.5px;padding:4px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:start;display:flex;flex-direction:column;gap:1px;min-width:0}
.tile .k{font-size:12.5px;color:var(--muted)}
.tile .v{font-weight:700;font-size:18px;line-height:1.35;overflow-wrap:anywhere}
.tile .s{font-size:12px;color:var(--muted)}
.tile.in .v{color:var(--pos)} .tile.out .v{color:var(--neg)}
.progress-card{display:flex;align-items:center;gap:14px}
.ring-box{position:relative;width:78px;height:78px;flex:none}
.ring{width:78px;height:78px;display:block}
.ring-num{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:16px}
.progress-card h2{margin-bottom:2px}
.progress-card p{color:var(--muted);font-size:13.5px}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;font-size:13.5px;font-weight:500}
.alert svg{width:20px;height:20px;flex:none;margin-top:2px}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.over{background:var(--neg-bg);color:var(--neg)}

/* rows (ledger) */
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 12px;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface2)}
.row-main{display:flex;flex-direction:column;min-width:0}
.row-name{font-weight:600;overflow-wrap:anywhere}
.row-sub{font-size:12.8px;color:var(--muted);overflow-wrap:anywhere}
.row-note{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.row-amt{font-weight:700;font-size:16px}
.row.in .row-amt{color:var(--pos)} .row.out .row-amt{color:var(--neg)}
.row.done .row-amt{color:var(--muted);font-weight:500}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.row .bar{grid-column:1/-1;margin-top:6px;height:5px}
.bar>i{display:block;height:100%;background:var(--pos);border-radius:3px}
.out .bar>i,.bar.out>i,.bar.over>i{background:var(--neg)}
.bar.warn>i{background:var(--gold)}
.dir{font-weight:600}
.dir-in{color:var(--pos)} .dir-out{color:var(--neg)}
.tag,.badge{display:inline-block;font-size:11.5px;font-weight:600;line-height:1.5;padding:1px 9px;border-radius:99px;white-space:nowrap}
.tag{background:var(--surface2);color:var(--muted)}
.row-name .tag{margin-inline-start:8px}
.badge.overdue{background:var(--neg-bg);color:var(--neg)}
.badge.soon{background:var(--warn-bg);color:var(--warn)}
.badge.partial{background:var(--surface2);color:var(--fg)}
.badge.paid{background:var(--pos-bg);color:var(--pos)}
.ledger-foot{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between;padding:10px 14px;font-size:13px;color:var(--muted);background:var(--surface2)}
.dsec+.dsec{margin-top:18px}

/* tools */
.subtabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;margin-bottom:14px}
.subtab{border:0;background:transparent;border-radius:9px;padding:7px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.subtab[aria-pressed="true"]{background:var(--surface);color:var(--link);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.search{position:relative}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--muted);pointer-events:none}
.search input{padding-inline-start:40px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.month-nav .mname{font-weight:700;font-size:16px;text-align:center;flex:1}
.month-nav .icon-btn{background:var(--surface);border:1px solid var(--line)}

/* forms */
input,select,textarea{width:100%;min-height:46px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:16px}
textarea{min-height:90px;resize:vertical;line-height:1.55}
input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--neg)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.legend{font-size:13.5px;font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two .field,.field{min-width:0}
input[type="date"],input[type="time"]{padding-inline:8px;min-width:0}
.hint{font-size:12.5px;color:var(--muted)}
.err{color:var(--neg);background:var(--neg-bg);border-radius:10px;padding:9px 12px;font-size:13.5px;margin-bottom:12px}
fieldset{border:0;padding:0;margin:0 0 12px;min-width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg.s3{grid-template-columns:repeat(3,1fr)}
.seg-opt{position:relative;display:block}
.seg-opt input{position:absolute;opacity:0;inset:0;width:100%;min-height:0;cursor:pointer}
.seg-opt span{display:flex;flex-direction:column;gap:1px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);height:100%}
.seg-opt b{font-size:14.5px}
.seg-opt small{font-size:12px;color:var(--muted);line-height:1.4}
.seg-opt input:checked+span{border-color:var(--gold);background:var(--surface)}
.seg-opt input:checked+span b{color:var(--link)}
.seg-opt input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.radios{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.radios label{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.radios input{width:20px;min-height:20px;height:20px;margin-top:3px;accent-color:var(--gold)}
.inline-form{display:flex;gap:8px;margin-top:8px}
.inline-form input{min-height:42px;padding-block:6px}
.inline-form .btn{min-height:42px;padding:6px 14px;flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 18px;border-radius:12px;border:1.5px solid transparent;font-weight:600;font-size:15px}
.btn svg{width:19px;height:19px;flex:none}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.line{background:transparent;border-color:var(--line)}
.btn.danger{background:var(--neg-bg);color:var(--neg)}
.btn:disabled{opacity:.55;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions .btn{flex:1 1 140px}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:50%;border:0;background:var(--surface2);flex:none}
.icon-btn svg{width:20px;height:20px}

/* tab bar + fab */
.tabs{position:fixed;inset:auto 0 0 0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabs-h)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;color:var(--muted);font-size:11.5px;font-weight:500;position:relative;min-width:0}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--link);font-weight:700}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.fab-rail{position:fixed;left:0;right:0;bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:24;pointer-events:none}
.fab-in{display:flex;justify-content:flex-end}
.fab{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 20px;border-radius:99px;border:0;background:var(--gold);color:var(--on-gold);font-weight:700;font-size:15.5px;box-shadow:var(--shadow)}
.fab svg{width:22px;height:22px}

/* sheet */
.sheet-host{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet-host[hidden]{display:none}
.sheet{width:100%;max-width:640px;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));box-shadow:var(--shadow);animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(24px)}to{transform:none}}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-head h2{font-size:18px;font-weight:700;overflow-wrap:anywhere}
.sheet-head h2:focus{outline:none}
.msg{margin-bottom:16px}
.textbox{font-family:var(--f-body);direction:rtl}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--field);font-weight:600;text-align:start}
.qbtn svg{width:22px;height:22px;color:var(--link);flex:none}
.sheet-sec{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.sheet-sec h3{font-size:14.5px;margin-bottom:6px}
.sheet-sec .btns{display:flex;flex-direction:column;gap:10px}

/* debt detail */
.d-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;color:var(--muted);font-size:13.5px}
.d-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.d-grid>div{background:var(--surface2);border-radius:12px;padding:9px 10px;min-width:0}
.d-grid .k{display:block;font-size:12px;color:var(--muted)}
.d-grid .v{display:block;font-weight:700;font-size:15px;overflow-wrap:anywhere}
.d-grid .v.pos{color:var(--pos)} .d-grid .v.neg{color:var(--neg)}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:14px 0;font-size:14px}
.facts dt{color:var(--muted)} .facts dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.pay-list{margin-top:16px}
.pay-list h3{font-size:14.5px;margin-bottom:6px}
.pay{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.pay:last-child{border-bottom:0}
.pay small{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.pay .icon-btn{width:34px;height:34px;background:transparent;color:var(--muted)}
.pay .icon-btn svg{width:18px;height:18px}
.d-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.d-actions .actions .btn{flex:1 1 120px}

/* finance */
.bucket{padding:10px 0;border-bottom:1px solid var(--line)}
.bucket:last-of-type{border-bottom:0}
.bucket-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;align-items:baseline;margin-bottom:6px}
.bucket-name{font-weight:600}
.bucket-name small{color:var(--muted);font-weight:500;margin-inline-start:6px}
.bucket-sub{display:flex;justify-content:space-between;gap:10px;font-size:12.8px;color:var(--muted);margin-top:5px;flex-wrap:wrap}
.donut-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}

.cal-h{text-align:center;font-size:11.5px;color:var(--muted);font-weight:600}
.cal button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--field);font-size:13px;font-weight:600;padding:0}
.cal button.on{background:var(--pos);border-color:var(--pos);color:#fff}
.cal button.today{outline:2px solid var(--gold);outline-offset:1px}
.cal button:disabled{opacity:.4;cursor:default}

.goal-title{font-weight:700;overflow-wrap:anywhere}
.goal-meta{font-size:12.8px;color:var(--muted);margin:2px 0 8px}

.goal-pct{font-size:12.8px;color:var(--muted);display:flex;justify-content:space-between}

.step .check svg{width:14px;height:14px}
.step.done span{text-decoration:line-through;color:var(--muted)}

.note-title{font-weight:700;overflow-wrap:anywhere}
.note-text{color:var(--fg);font-size:14px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.note-date{font-size:12px;color:var(--muted);margin-top:4px}
.note-wrap{position:relative}
.note-pin{position:absolute;inset-inline-end:8px;top:8px;width:34px;height:34px;background:transparent;color:var(--muted)}
.note-pin[aria-pressed="true"]{color:var(--gold)}
.note-pin svg{width:18px;height:18px}
.note-wrap .note{padding-inline-end:46px}

/* panels (settings) */
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:14px}

/* empty + skeleton */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:26px 18px;text-align:center}
.empty.small{padding:16px 14px}
.empty svg{width:44px;height:44px;color:var(--gold);margin-bottom:6px}
.empty h2{font-size:18px;margin-bottom:6px}
.empty p{color:var(--muted);margin-bottom:14px;max-width:38ch;margin-inline:auto}
.empty.small p{margin-bottom:0}
.empty .actions{justify-content:center}

/* toast */
.toast{position:fixed;z-index:70;inset-inline:0;top:calc(env(safe-area-inset-top,0px) + 74px);margin-inline:auto;width:max-content;max-width:calc(100% - 32px);padding:10px 18px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:14px;font-weight:600;box-shadow:var(--shadow);text-align:center}
.toast[hidden]{display:none}
.toast.err{background:var(--neg);color:#fff}
.toast.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}

@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
@media (max-width:380px){

}

  .two{grid-template-columns:1fr}
  .seg,.seg.s3{grid-template-columns:1fr}

}

<noscript><p style="padding:24px;text-align:center">يحتاج «الحاج» إلى تفعيل JavaScript ليعمل.</p></noscript>
<script>
(function(){

/* ---- 10-core.js ---- */

function fmtC(c){var a=Math.abs(c);return (c<0?'\u2212':'')+(a%100===0?nf0:nf2).format(a/100);}

/* ---- digits, amounts ---- */
function normDigits(s){
  return String(s==null?'':s)
    .replace(/[٠-٩]/g,d=>String(d.charCodeAt(0)-0x0660))
    .replace(/[۰-۹]/g,d=>String(d.charCodeAt(0)-0x06F0));

function parseAmount(raw){
  var s=normDigits(raw).replace(/[\s  ٬']/g,'').replace(/٫/g,'.');
  if(!s||!/^[0-9.,]+$/.test(s))return NaN;
  var lastDot=s.lastIndexOf('.'),lastComma=s.lastIndexOf(',');
  var last=Math.max(lastDot,lastComma);
  var intPart,decPart='';
  if(last===-1){intPart=s;}
  else{
    var sep=s.charAt(last),other=sep==='.'?',':'.';
    var sameCount=s.split(sep).length-1;
    var before=s.slice(0,last),after=s.slice(last+1);
    if(s.indexOf(other)!==-1){
      if(sameCount>1)return NaN;
      if(after.length<1||after.length>2)return NaN;
      var groupsO=before.split(other);
      for(var i=1;i<groupsO.length;i++){if(groupsO[i].length!==3)return NaN;}
      if(groupsO[0].length<1||groupsO[0].length>3)return NaN;
      intPart=groupsO.join('');decPart=after;
    }else if(sameCount>1){
      var groups=s.split(sep);
      for(var j=1;j<groups.length;j++){if(groups[j].length!==3)return NaN;}
      if(groups[0].length<1||groups[0].length>3)return NaN;
      intPart=groups.join('');
    }else{
      if(after.length===3&&before.length>=1&&before.length<=3&&before!=='0'){intPart=before+after;}
      else if(after.length>=1&&after.length<=2){intPart=before===''?'0':before;decPart=after;}
      else return NaN;
    }

  if(!/^[0-9]+$/.test(intPart))return NaN;
  if(decPart&&!/^[0-9]+$/.test(decPart))return NaN;
  var v=Number(intPart+(decPart?'.'+decPart:''));
  if(!isFinite(v))return NaN;

function parseIntStrict(raw){
  var s=normDigits(raw).replace(/\s/g,'');

/* ---- dates ---- */
function isDateStr(s){
  if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;
  var p=s.split('-').map(Number),y=p[0],m=p[1],d=p[2];

function dayNum(s){var p=s.split('-').map(Number);return Math.round(Date.UTC(p[0],p[1]-1,p[2])/86400000);}

function addDays(s,n){var dt=new Date((dayNum(s)+n)*86400000);return dt.getUTCFullYear()+'-'+pad(dt.getUTCMonth()+1)+'-'+pad(dt.getUTCDate());}

function addMonths(ym,n){var p=ym.split('-').map(Number);var t=p[0]*12+(p[1]-1)+n;return Math.floor(t/12)+'-'+pad(t%12+1);}

function fmtDate(s){if(!isDateStr(s))return '';var p=s.split('-').map(Number);return p[2]+' '+MONTHS[p[1]-1]+' '+p[0];}
function weekdayOf(s){var p=s.split('-').map(Number);return WEEKDAYS[new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay()];}
function plu(n,one,two,few,many){if(n===1)return one;if(n===2)return two;if(n>=3&&n<=10)return n+' '+few;return n+' '+many;}
const pluDay=n=>plu(n,'يوم واحد','يومين','أيام','يومًا');
const pluHour=n=>plu(n,'ساعة واحدة','ساعتين','ساعات','ساعة');

/* ---- hijri ---- */
function gregToJD(y,m,d){var a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;}

  var jd=gregToJD(y,m,d);
  var l=jd-1948440+10632,n=Math.floor((l-1)/10631);

  var j=Math.floor((10985-l)/5316)*Math.floor((50*l)/17719)+Math.floor(l/5670)*Math.floor((43*l)/15238);

  var mo=Math.floor((24*l)/709);

function hijriStr(dateStr,adj){
  var p=dateStr.split('-').map(Number);

function normGoal(x){

const DEFAULT_SPLIT={needs:50,wants:30,save:20};
function normSplit(x){
  if(!x||typeof x!=='object')return Object.assign({},DEFAULT_SPLIT);

  return ok?{needs:n,wants:w,save:s}:Object.assign({},DEFAULT_SPLIT);
}
function normSettings(x){

    split:normSplit(x.split),

  };

const KINDS=['debts','tx','tasks','appts','habits','goals','notes'];
const NORMS={debts:normDebt,tx:normTx,tasks:normTask,appts:normAppt,habits:normHabit,goals:normGoal,notes:normNote};
const CAPS={debts:5000,tx:20000,tasks:5000,appts:3000,habits:200,goals:500,notes:3000};
const KIND_NAMES={debts:'ديون',tx:'عمليات مالية',tasks:'مهام',appts:'مواعيد',habits:'عادات',goals:'أهداف',notes:'ملاحظات'};
function listNorm(arr,fn,cap){
  var out=[],seen={};
  if(!Array.isArray(arr))return out;
  for(var i=0;i<arr.length&&out.length<cap;i++){
    var x=fn(arr[i]);
    if(!x)continue;
    if(seen[x.id])x.id=newId(x.id);
    seen[x.id]=1;out.push(x);
  }
  return out;
}
function normState(raw){
  raw=raw&&typeof raw==='object'?raw:{};
  var s={v:2,settings:normSettings(raw.settings),salaries:{}};
  var sal=raw.salaries&&typeof raw.salaries==='object'&&!Array.isArray(raw.salaries)?raw.salaries:{};
  Object.keys(sal).slice(0,600).forEach(function(k){var a=Number(sal[k]);if(isYm(k)&&isFinite(a)&&a>=0&&a<=MAX_AMOUNT)s.salaries[k]=round2(a);});
  KINDS.forEach(function(k){s[k]=listNorm(raw[k],NORMS[k],CAPS[k]);});
  return s;
}
function mergeState(cur,inc){
  var out={v:2,settings:cur.settings,salaries:Object.assign({},cur.salaries,inc.salaries)};
  KINDS.forEach(function(k){
    var map=new Map();
    cur[k].forEach(x=>map.set(x.id,x));
    inc[k].forEach(x=>map.set(x.id,x));
    out[k]=Array.from(map.values()).slice(0,CAPS[k]);
  });
  return out;
}
function countState(s){var o={},t=0;KINDS.forEach(function(k){o[k]=s[k].length;t+=s[k].length;});o.salaries=Object.keys(s.salaries).length;o.total=t+o.salaries;return o;}
function parseBackup(text){
  if(typeof text!=='string'||!text.trim())return {error:'الصق نص النسخة الاحتياطية أو اختر ملفًا أولًا.'};
  if(text.length>8000000)return {error:'الملف كبير جدًا.'};
  var j;
  try{j=JSON.parse(text);}catch(e){return {error:'هذا النص ليس نسخة احتياطية صالحة.'};}
  var data=null;
  if(Array.isArray(j))data={debts:j};
  else if(j&&typeof j==='object')data=(j.data&&typeof j.data==='object')?j.data:j;
  if(!data)return {error:'لم أجد بيانات في هذا النص.'};
  var skipped=0;
  for(var i=0;i<KINDS.length;i++){
    var k=KINDS[i],raw=data[k];
    if(Array.isArray(raw)&&raw.length>CAPS[k])return {error:'عدد العناصر أكبر من الحد المسموح ('+KIND_NAMES[k]+').'};
  }
  var st=normState(data);
  KINDS.forEach(function(k){if(Array.isArray(data[k]))skipped+=Math.max(0,data[k].length-st[k].length);});
  var c=countState(st);
  if(!c.total)return {error:'لا توجد بيانات صالحة في هذه النسخة.'};
  return {state:st,counts:c,skipped:skipped,hasSettings:!!(data.settings&&typeof data.settings==='object')};
}

/* ---- finance ---- */
function salaryFor(S,ym){
  var keys=Object.keys(S.salaries).filter(k=>k<=ym).sort();
  return keys.length?S.salaries[keys[keys.length-1]]:0;
}
function monthStats(S,ym){
  var extraC=0,expC=0,byCat={},byBucket={needs:0,wants:0,save:0};
  S.tx.forEach(function(t){
    if(ymOf(t.date)!==ym)return;
    var c=toC(t.amount);
    if(t.type==='inc')extraC+=c;
    else{expC+=c;byCat[t.cat]=(byCat[t.cat]||0)+c;byBucket[t.bucket]+=c;}
  });
  var salC=toC(salaryFor(S,ym)),incC=salC+extraC,sp=S.settings.split;
  var b={};
  b.needs=Math.round(incC*sp.needs/100);
  b.wants=Math.round(incC*sp.wants/100);
  b.save=incC-b.needs-b.wants;
  return {salC:salC,extraC:extraC,incC:incC,expC:expC,remC:incC-expC,byCat:byCat,byBucket:byBucket,budget:b};
}
function budgetAlerts(st){
  var out=[];
  ['needs','wants'].forEach(function(id){
    var bud=st.budget[id],sp=st.byBucket[id],nm=bucketName(id).name;
    if(bud>0&&sp>bud)out.push({kind:'over',text:'تجاوزت ميزانية «'+nm+'» بمقدار '+fmtC(sp-bud)});
    else if(bud>0&&sp*100>=bud*80)out.push({kind:'warn',text:'اقتربت من تجاوز ميزانية «'+nm+'» ('+Math.round(sp*100/bud)+'% مصروف)'});
    else if(bud===0&&sp>0)out.push({kind:'warn',text:'صرفت على «'+nm+'» دون ميزانية محددة. حدّد شهريتك أولًا.'});
  });
  if(st.expC>st.incC&&st.incC>0)out.unshift({kind:'over',text:'مصاريفك تجاوزت دخلك هذا الشهر بمقدار '+fmtC(st.expC-st.incC)});
  return out;
}

/* ---- debts ---- */
function calcDebt(d,today,soonDays){
  var amountC=toC(d.amount),paidC=0;
  for(var i=0;i<d.payments.length;i++)paidC+=toC(d.payments[i].amount);
  var remC=Math.max(0,amountC-paidC),status='open',days=null;
  if(remC===0)status='paid';
  else{
    if(d.due){days=diffDays(d.due,today);if(days<0)status='overdue';else if(days<=soonDays)status='soon';}
    if(status==='open'&&paidC>0)status='partial';
  }
  return {amountC:amountC,paidC:paidC,remC:remC,status:status,days:days};
}

/* ---- tasks / appointments / habits / goals ---- */
function apptDate(a){
  var p=a.date.split('-').map(Number),t=a.time?a.time.split(':').map(Number):[23,59];
  return new Date(p[0],p[1]-1,p[2],t[0],t[1],0,0);
}
function apptWhen(a){return apptDate(a).getTime();}
function isUpcoming(a,now){return a.time?apptWhen(a)>=now.getTime():a.date>=ymd(now);}
function countdown(a,now){
  var today=ymd(now);
  if(!a.time){
    var n=diffDays(a.date,today);
    if(n<0)return {past:true,soon:false,label:'انقضى منذ '+pluDay(-n)};
    if(n===0)return {past:false,soon:true,label:'اليوم'};
    if(n===1)return {past:false,soon:false,label:'غدًا'};
    return {past:false,soon:false,label:'بعد '+pluDay(n)};
  }
  var ms=apptWhen(a)-now.getTime();
  if(ms<0){
    var pm=Math.floor(-ms/60000);
    if(pm<60)return {past:true,soon:false,label:'انقضى منذ '+pluMin(Math.max(1,pm))};
    if(pm<1440)return {past:true,soon:false,label:'انقضى منذ '+pluHour(Math.floor(pm/60))};
    return {past:true,soon:false,label:'انقضى منذ '+pluDay(Math.floor(pm/1440))};
  }
  var mins=Math.floor(ms/60000);
  if(mins<1)return {past:false,soon:true,label:'الآن'};
  if(mins<60)return {past:false,soon:true,label:'بعد '+pluMin(mins)};
  var hrs=Math.floor(mins/60),rm=mins%60;
  if(hrs<24)return {past:false,soon:true,label:'بعد '+pluHour(hrs)+(rm?' و'+pluMin(rm):'')};
  var days=Math.floor(hrs/24),rh=hrs%24;
  return {past:false,soon:days<2,label:'بعد '+pluDay(days)+(rh?' و'+pluHour(rh):'')};
}
function habitStats(h,today){
  var log=h.log,cur=0,d=log[today]?today:addDays(today,-1);
  while(log[d]){cur++;d=addDays(d,-1);}
  var days=Object.keys(log).sort(),best=0,run=0,prev=null;
  days.forEach(function(x){run=(prev&&diffDays(x,prev)===1)?run+1:1;if(run>best)best=run;prev=x;});
  return {current:cur,best:best,total:days.length,doneToday:!!log[today]};
}
function goalProgress(g){
  var total=g.steps.length,done=g.steps.filter(s=>s.done).length;
  return {total:total,done:done,pct:total?Math.round(done*100/total):0,complete:total>0&&done===total};
}
function dailyScope(S,today){
  var open=S.tasks.filter(t=>!t.done&&(!t.due||t.due<=today)).length;
  var doneT=S.tasks.filter(t=>t.done&&t.doneAt===today).length;
  var habs=S.habits.length,habDone=S.habits.filter(h=>h.log[today]).length;
  var total=open+doneT+habs,done=doneT+habDone;
  return {total:total,done:done,pct:total?Math.round(done*100/total):null,openTasks:open,doneTasks:doneT,habits:habs,habitsDone:habDone};
}

function csvCell(v){
  var s=String(v==null?'':v);
  if(/^[=+\-@\t\r]/.test(s))s="'"+s;

}

async function copyText(text){

    var ta=document.createElement('textarea');
    ta.value=text;ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);ta.select();
    var ok=document.execCommand&&document.execCommand('copy');
    document.body.removeChild(ta);
    return !!ok;
  }catch(e){return false;}
}
function downloadFile(name,text,mime){
  try{
    var blob=new Blob([text],{type:mime});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download=name;a.rel='noopener';a.style.display='none';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},6000);
    return true;
  }catch(e){return false;}
}

const SHEET_BUILDERS={form:buildForm,confirm:buildConfirm,copy:buildCopy,debt:buildDebtDetail,habit:buildHabitDetail,export:buildExport,import:buildImport,quick:buildQuick};
function topSheet(){return ui.sheets[ui.sheets.length-1];}
function openSheet(e){e.opener=document.activeElement;ui.sheets.push(e);renderSheet(true);}
function swapSheet(e){var first=ui.sheets[0];e.opener=first?first.opener:document.activeElement;ui.sheets=[e];renderSheet(true);}
function hideSheetHost(){
  $('#sheetHost').hidden=true;
  $('#sheetPanel').innerHTML='';
  document.body.classList.remove('lock');
}
function refocus(el){if(el&&document.contains(el)){try{el.focus();}catch(x){}}}
function closeSheet(){
  var e=ui.sheets.pop();
  if(!ui.sheets.length){hideSheetHost();if(e)refocus(e.opener);}
  else renderSheet(true);
}
function closeAllSheets(){
  var first=ui.sheets[0];
  ui.sheets=[];
  hideSheetHost();
  if(first)refocus(first.opener);
}
function sheetHead(title){
  return '<div class="grab"></div><div class="sheet-head"><h2 id="sheetTitle" tabindex="-1">'+esc(title)+'</h2><button type="button" class="icon-btn" data-act="close" aria-label="إغلاق">'+icon('close')+'</button></div>';
}
function renderSheet(focus){
  var e=topSheet();
  if(!e)return;
  var panel=$('#sheetPanel'),html=SHEET_BUILDERS[e.type](e);
  if(html===null){closeAllSheets();return;}
  var scroll=panel.scrollTop;
  panel.innerHTML=html;
  $('#sheetHost').hidden=false;
  document.body.classList.add('lock');
  if(focus){
    var f=$('[data-autofocus]',panel)||$('#sheetTitle',panel);
    if(f){try{f.focus({preventScroll:true});}catch(x){}}
    panel.scrollTop=0;

}
function askConfirm(o){openSheet({type:'confirm',title:o.title,message:o.message,confirmLabel:o.confirmLabel||'نعم',danger:o.danger!==false,closeAll:!!o.closeAll,onConfirm:o.onConfirm});}
function buildConfirm(e){

function buildCopy(e){

/* ===== generic form engine ===== */
function flatFields(fields){var o=[];fields.forEach(function(f){if(Array.isArray(f))f.forEach(function(x){o.push(x);});else o.push(f);});return o;}
function optHtml(f,v){return f.options.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(v)===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>';}).join('');}
function fieldHtml(f){
  var id='g-'+f.k,v=f.value==null?'':f.value,rr=f.rr?' data-rr="1"':'',af=f.focus?' data-autofocus':'';
  var hint=f.hint?'<span class="hint">'+esc(f.hint)+'</span>':'';
  if(f.type==='seg'){
    return '<fieldset class="seg s'+f.options.length+'"><legend class="sr">'+esc(f.label)+'</legend>'+f.options.map(function(o){
      return '<label class="seg-opt"><input type="radio" name="'+f.k+'" value="'+esc(o[0])+'"'+(String(v)===String(o[0])?' checked':'')+rr+'><span><b>'+esc(o[1])+'</b>'+(o[2]?'<small>'+esc(o[2])+'</small>':'')+'</span></label>';
    }).join('')+'</fieldset>';
  }
  var input;
  if(f.type==='select')input='<select id="'+id+'" name="'+f.k+'"'+rr+af+'>'+optHtml(f,v)+'</select>';
  else if(f.type==='textarea')input='<textarea id="'+id+'" name="'+f.k+'" maxlength="'+(f.max||500)+'"'+(f.rows?' rows="'+f.rows+'"':'')+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+af+'>'+esc(v)+'</textarea>';
  else{
    var t=(f.type==='amount'||f.type==='int')?'text':(f.type||'text');
    var im=f.type==='amount'?' inputmode="decimal"':(f.type==='int'?' inputmode="numeric"':'');
    input='<input id="'+id+'" name="'+f.k+'" type="'+t+'"'+im+(f.max?' maxlength="'+f.max+'"':'')+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+' autocomplete="off" value="'+esc(v)+'"'+(f.list?' list="dl-'+f.k+'"':'')+af+'>'+
      (f.list?'<datalist id="dl-'+f.k+'">'+f.list.map(function(n){return '<option value="'+esc(n)+'"></option>';}).join('')+'</datalist>':'');
  }
  return '<div class="field"><label for="'+id+'">'+esc(f.label)+'</label>'+input+hint+'</div>';
}
function buildForm(e){
  var fields=e.fieldsFn(e.vals);
  e.fields=flatFields(fields);
  var body=fields.map(function(f){return Array.isArray(f)?'<div class="two">'+f.map(fieldHtml).join('')+'</div>':fieldHtml(f);}).join('');
  return sheetHead(e.title)+(e.intro?'<p class="hint mb">'+esc(e.intro)+'</p>':'')+
    '<form id="genForm" novalidate>'+body+'<p class="err" id="formErr" role="alert" hidden></p>'+
    '<div class="actions"><button type="submit" class="btn gold">'+esc(e.submit||'حفظ')+'</button><button type="button" class="btn ghost" data-act="close">إلغاء</button></div>'+
    (e.del?'<div class="actions mt"><button type="button" class="btn danger" data-act="form-del">'+icon('trash')+esc(e.del.label||'حذف')+'</button></div>':'')+
    '</form>'+(typeof e.after==='function'?e.after(e):(e.after||''));
}
function collectForm(form,e){
  var v={};
  e.fields.forEach(function(f){
    if(f.type==='seg'){var r=form.querySelector('input[name="'+f.k+'"]:checked');v[f.k]=r?r.value:'';}
    else{var el=form.querySelector('[name="'+f.k+'"]');v[f.k]=el?el.value:'';}
  });
  return v;
}
function showFormError(msg,field){
  var el=$('#formErr');
  if(el){el.textContent=msg;el.hidden=false;}
  $$('#sheetPanel [aria-invalid]').forEach(function(x){x.removeAttribute('aria-invalid');});
  if(field){var f=document.getElementById('g-'+field)||document.getElementById(field);if(f){f.setAttribute('aria-invalid','true');try{f.focus();}catch(e){}}}
}
function openForm(o){
  var vals=Object.assign({},o.vals||{});
  openSheet(Object.assign({type:'form'},o,{vals:vals}));
}
function submitForm(form){
  var e=topSheet();
  if(!e||e.type!=='form')return;
  var vals=collectForm(form,e),r;
  try{r=e.onSubmit(vals);}
  catch(x){console.error(x);showFormError('حدث خطأ غير متوقع. حاول مرة أخرى.');return;}
  if(r&&typeof r==='object'&&r.err){showFormError(r.err,r.field);return;}
  closeSheet();
  if(e.toast)toast(e.toast);
}
function rerenderForm(target){
  var form=target.closest('#genForm'),e=topSheet();
  if(!form||!e||e.type!=='form')return;
  e.vals=Object.assign({},e.vals,collectForm(form,e));
  if(e.onRerr)e.onRerr(e,target.name);
  renderSheet(false);
  var nm=target.name,el=document.getElementById('g-'+nm)||document.querySelector('#sheetPanel input[name="'+nm+'"]:checked');
  if(el){try{el.focus({preventScroll:true});}catch(x){}}
}

function donutSvg(segs,total){
  var r=54,C=2*Math.PI*r,off=0,out='';
  segs.forEach(function(s){
    var len=C*s.c/total,vis=Math.max(0.5,len-(segs.length>1?1.6:0));
    out+='<circle cx="70" cy="70" r="'+r+'" fill="none" style="stroke:'+s.color+'" stroke-width="22" stroke-dasharray="'+vis.toFixed(2)+' '+(C-vis).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 70 70)"/>';
    off+=len;
  });
  return '<svg class="donut" viewBox="0 0 140 140" aria-hidden="true">'+out+'</svg>';

/* ---- 60-debts.js ---- */
/* ===== debts ===== */
function debtViews(){var t=todayStr(),sd=S.settings.soonDays;return S.debts.map(function(d){return {d:d,c:calcDebt(d,t,sd)};});}
function dirWord(d){return d==='in'?'لي عنده':'عليّ له';}
function statusLabel(s){return {paid:'مسدّد',overdue:'متأخر',soon:'يستحق قريبًا',partial:'مسدّد جزئيًا',open:'قائم'}[s]||'';}
function debtBadge(c){
  var t={overdue:'متأخر',soon:'قريبًا',partial:'جزئي',paid:'مسدّد'}[c.status];
  return t?'<span class="badge '+c.status+'">'+t+'</span>':'';
}
function dueLine(d,c){
  if(c.status==='paid')return 'مسدّد بالكامل';
  if(!d.due)return 'بدون موعد استحقاق';
  if(c.days<0)return 'متأخر '+pluDay(-c.days);
  if(c.days===0)return 'يستحق اليوم';
  if(c.days===1)return 'يستحق غدًا';
  return 'يستحق بعد '+pluDay(c.days);
}
function debtRow(v){
  var d=v.d,c=v.c,done=c.status==='paid',pct=c.amountC>0?Math.min(100,Math.round(c.paidC*100/c.amountC)):0;
  var sub=d.reason||(d.note?d.note.split('\n')[0]:'');
  return '<button type="button" class="row '+d.dir+(done?' done':'')+'" data-act="debt-open" data-id="'+esc(d.id)+'">'+
    '<span class="row-main"><span class="row-name">'+esc(d.person)+'</span>'+
    '<span class="row-sub"><span class="dir dir-'+d.dir+'">'+dirWord(d.dir)+'</span> · '+esc(dueLine(d,c))+'</span>'+
    (sub?'<span class="row-note">'+esc(sub)+'</span>':'')+'</span>'+
    '<span class="row-side"><span class="row-amt">'+money(done?c.amountC:c.remC)+'</span>'+debtBadge(c)+'</span>'+
    (c.paidC>0&&!done?'<span class="bar"><i style="width:'+pct+'%"></i></span>':'')+'</button>';
}
function debtSort(a,b){
  var rank=function(v){return v.c.status==='paid'?2:(v.d.due?0:1);};
  var ra=rank(a),rb=rank(b);
  if(ra!==rb)return ra-rb;
  if(ra===0&&a.d.due!==b.d.due)return a.d.due<b.d.due?-1:1;
  return a.d.date<b.d.date?1:a.d.date>b.d.date?-1:0;
}
function renderDebts(){
  if(!S.debts.length){
    return '<section class="empty"><div>'+icon('swap')+'</div><h2>لا توجد ديون مسجّلة</h2><p>سجّل ما لك وما عليك مع الدفعات والمواعيد لتتابعها في مكان واحد.</p>'+
      '<div class="actions"><button type="button" class="btn gold" data-act="debt-new">'+icon('plus')+'إضافة أول دين</button></div></section>';
  }
  var h='<div class="subtabs" role="group" aria-label="طريقة العرض">'+
    [['list','الديون'],['people','الأشخاص']].map(function(x){return '<button type="button" class="subtab" data-act="dv" data-v="'+x[0]+'" aria-pressed="'+(ui.dv===x[0])+'">'+x[1]+'</button>';}).join('')+'</div>';
  if(ui.dv==='list'){
    h+='<div class="tools"><div class="search">'+icon('search')+'<input id="dq" type="search" placeholder="ابحث بالاسم أو السبب أو الملاحظة" autocomplete="off" aria-label="بحث في الديون" maxlength="80" value="'+esc(ui.dq)+'"></div>'+
      '<div class="chips" role="group" aria-label="حالة الدين">'+[['open','قائمة'],['overdue','متأخرة'],['paid','مسدّدة'],['all','الكل']].map(function(x){return '<button type="button" class="chip" data-act="dstatus" data-v="'+x[0]+'" aria-pressed="'+(ui.dstatus===x[0])+'">'+x[1]+'</button>';}).join('')+'</div></div>';
  }
  return h+'<div id="debtList" aria-live="polite">'+debtListHtml()+'</div>';
}
function refreshDebtList(){var el=$('#debtList');if(el)el.innerHTML=debtListHtml();}
function debtSection(dir,title,arr,emptyText){
  var sel=arr.filter(function(v){return v.d.dir===dir;}),tot=0;
  sel.forEach(function(v){tot+=v.c.remC;});
  return '<section class="dsec" aria-label="'+esc(title)+'"><div class="sec-head"><h2>'+esc(title)+'<span class="count">'+sel.length+'</span></h2><span class="sec-total '+dir+'">'+money(tot)+'</span></div>'+
    (sel.length?'<div class="ledger">'+sel.map(debtRow).join('')+'</div>':'<div class="empty small"><p>'+esc(emptyText)+'</p></div>')+'</section>';
}
function debtListHtml(){
  if(ui.dv==='people')return peopleHtml();
  var q=normSearch(ui.dq);
  var arr=debtViews().filter(function(v){
    if(ui.dstatus==='open'&&v.c.status==='paid')return false;
    if(ui.dstatus==='overdue'&&v.c.status!=='overdue')return false;
    if(ui.dstatus==='paid'&&v.c.status!=='paid')return false;
    if(q&&normSearch(v.d.person+' '+v.d.reason+' '+v.d.note+' '+v.d.phone).indexOf(q)===-1)return false;
    return true;
  }).sort(debtSort);
  if(!arr.length)return '<section class="empty"><h2>لا توجد نتائج</h2><p>لا يوجد دين يطابق البحث أو الفلاتر الحالية.</p><div class="actions"><button type="button" class="btn ghost" data-act="dreset">إعادة ضبط الفلاتر</button></div></section>';
  return debtSection('out','ديون عليّ (يجب سدادها)',arr,'لا توجد ديون عليك هنا.')+debtSection('in','ديون لي (عند الناس)',arr,'لا توجد ديون لك عند الناس هنا.');
}
function peopleHtml(){
  var map=new Map();
  debtViews().forEach(function(v){
    var key=normSearch(v.d.person),p=map.get(key);
    if(!p){p={name:v.d.person,inC:0,outC:0,open:0,total:0,latest:''};map.set(key,p);}
    p.total++;
    if(v.d.date>=p.latest){p.latest=v.d.date;p.name=v.d.person;}
    if(v.c.remC>0){p.open++;if(v.d.dir==='in')p.inC+=v.c.remC;else p.outC+=v.c.remC;}
  });
  var arr=Array.from(map.values()).sort(function(a,b){
    var za=a.open===0?1:0,zb=b.open===0?1:0;
    if(za!==zb)return za-zb;
    var na=Math.abs(a.inC-a.outC),nb=Math.abs(b.inC-b.outC);
    if(na!==nb)return nb-na;
    return a.name.localeCompare(b.name,'ar');
  });
  return '<div class="sec-head"><h2>الأشخاص<span class="count">'+arr.length+'</span></h2></div><div class="ledger">'+arr.map(function(p){
    var net=p.inC-p.outC,cls,label,amt;
    if(p.open===0){cls='done';label='لا شيء متبقٍ';amt='—';}
    else if(net>0){cls='in';label='لك عنده';amt=money(net);}
    else if(net<0){cls='out';label='عليك له';amt=money(-net);}
    else{cls='done';label='متعادل';amt=money(0);}
    return '<button type="button" class="row '+cls+'" data-act="person" data-person="'+esc(p.name)+'"><span class="row-main"><span class="row-name">'+esc(p.name)+'</span><span class="row-sub">'+
      (p.open?p.open+(p.open===1?' دين قائم':' ديون قائمة'):p.total+(p.total===1?' دين مسدّد':' ديون مسدّدة'))+'</span></span><span class="row-side"><span class="row-amt">'+amt+'</span><span class="row-sub">'+label+'</span></span></button>';
  }).join('')+'</div>';
}

/* ===== tasks & appointments ===== */
const QUADS=[
  {id:'q1',name:'عاجل ومهم',hint:'افعلها اليوم'},
  {id:'q2',name:'مهم غير عاجل',hint:'خطّط لها'},
  {id:'q3',name:'مهام روتينية',hint:'أعمال متكررة وبسيطة'}
];
function taskRow(t){
  var today=todayStr(),over=!t.done&&t.due&&t.due<today;
  return '<div class="trow'+(t.done?' done':'')+'"><button type="button" class="check" role="checkbox" aria-checked="'+t.done+'" aria-label="'+(t.done?'إلغاء إنجاز: ':'إنجاز: ')+esc(t.title)+'" data-act="tasktoggle" data-id="'+esc(t.id)+'">'+(t.done?icon('check'):'')+'</button>'+
    '<button type="button" class="trow-main" data-act="task-edit" data-id="'+esc(t.id)+'"><span class="trow-title">'+esc(t.title)+'</span>'+
    (t.due?'<span class="trow-sub'+(over?' neg':'')+'">'+(over?'متأخرة · ':'')+esc(relDate(t.due,today))+'</span>':'')+'</button></div>';
}
function taskSort(a,b){
  if(a.due&&b.due&&a.due!==b.due)return a.due<b.due?-1:1;
  if(a.due&&!b.due)return -1;
  if(!a.due&&b.due)return 1;
  return a.createdAt<b.createdAt?-1:1;
}
function renderTasks(){
  var h='<div class="subtabs" role="group" aria-label="القسم">'+
    [['tasks','المهام'],['appts','المواعيد']].map(function(x){return '<button type="button" class="subtab" data-act="tk-sub" data-v="'+x[0]+'" aria-pressed="'+(ui.tk===x[0])+'">'+x[1]+'</button>';}).join('')+'</div>';
  return h+(ui.tk==='appts'?renderAppts():renderTaskLists());
}
function renderTaskLists(){
  var h='';
  QUADS.forEach(function(q){
    var open=S.tasks.filter(function(t){return t.quad===q.id&&!t.done;}).sort(taskSort);
    h+='<section class="tsec" aria-labelledby="q-'+q.id+'"><div class="sec-head"><h2 id="q-'+q.id+'">'+esc(q.name)+'<span class="count">'+open.length+'</span></h2></div>'+
      (open.length?'<div class="ledger">'+open.map(taskRow).join('')+'</div>':'<div class="empty small"><p>'+esc(q.hint)+': لا توجد مهام هنا.</p></div>')+
      '<form class="inline-form" data-form="qtask" data-quad="'+q.id+'"><input type="text" name="title" maxlength="140" placeholder="أضف مهمة سريعة" aria-label="مهمة جديدة في «'+esc(q.name)+'»" autocomplete="off"><button type="submit" class="btn ghost" aria-label="إضافة">'+icon('plus')+'</button></form></section>';
  });
  var done=S.tasks.filter(function(t){return t.done;}).sort(function(a,b){return (b.doneAt||'')<(a.doneAt||'')?-1:1;});
  if(done.length){
    h+='<section class="tsec" aria-labelledby="q-done"><div class="sec-head"><h2 id="q-done">المنجزة<span class="count">'+done.length+'</span></h2><button type="button" class="linkbtn" data-act="toggle-done" aria-expanded="'+ui.showDone+'">'+(ui.showDone?'إخفاء':'عرض')+'</button></div>'+
      (ui.showDone?'<div class="ledger">'+done.slice(0,50).map(taskRow).join('')+'</div><div class="actions mt"><button type="button" class="btn line" data-act="clear-done">'+icon('trash')+'مسح المنجزة</button></div>':'')+'</section>';
  }
  return h;
}
function renderAppts(){
  var now=new Date(),today=ymd(now);
  var ups=S.appts.filter(function(a){return isUpcoming(a,now);}).sort(function(a,b){return apptWhen(a)-apptWhen(b);});
  var past=S.appts.filter(function(a){return !isUpcoming(a,now);}).sort(function(a,b){return apptWhen(b)-apptWhen(a);});
  var h='';
  if(ups.length){
    var n=ups[0],cd=countdown(n,now);
    h+='<section class="count-hero" aria-label="الموعد القادم"><p class="k">الموعد القادم</p><p class="t">'+esc(n.title)+'</p><p class="c">'+esc(cd.label)+'</p><p class="w">'+esc(weekdayOf(n.date)+' '+fmtDate(n.date))+(n.time?' · '+esc(n.time):'')+'</p></section>';
  }
  h+='<section class="tsec" aria-labelledby="ap-up"><div class="sec-head"><h2 id="ap-up">المواعيد القادمة<span class="count">'+ups.length+'</span></h2></div>'+
    (ups.length?'<div class="ledger">'+ups.map(function(a){return apptRowHtml(a,now);}).join('')+'</div>':
    '<div class="empty"><div>'+icon('calendar')+'</div><h2>لا توجد مواعيد</h2><p>سجّل مواعيدك المهمة لترى العدّ التنازلي لكل موعد.</p><div class="actions"><button type="button" class="btn gold" data-act="appt-new">'+icon('plus')+'موعد جديد</button></div></div>')+'</section>';
  if(past.length){
    h+='<section class="tsec" aria-labelledby="ap-past"><div class="sec-head"><h2 id="ap-past">السابقة<span class="count">'+past.length+'</span></h2><button type="button" class="linkbtn" data-act="toggle-past" aria-expanded="'+ui.showPast+'">'+(ui.showPast?'إخفاء':'عرض')+'</button></div>'+
      (ui.showPast?'<div class="ledger">'+past.slice(0,50).map(function(a){return apptRowHtml(a,now);}).join('')+'</div>':'')+'</section>';
  }
  return h;
}

/* ---- 80-growth.js ---- */
/* ===== growth: habits, goals, notes ===== */
const HABIT_PRESETS=['رياضة','قراءة','تعلّم مهارة جديدة','ادخار','الصلاة في وقتها'];
const CAL_HEAD=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];

function renderGrow(){
  var h='<div class="subtabs" role="group" aria-label="القسم">'+
    [['habits','العادات'],['goals','الأهداف'],['notes','الملاحظات']].map(function(x){return '<button type="button" class="subtab" data-act="gr-sub" data-v="'+x[0]+'" aria-pressed="'+(ui.gr===x[0])+'">'+x[1]+'</button>';}).join('')+'</div>';
  if(ui.gr==='goals')return h+renderGoals();
  if(ui.gr==='notes')return h+renderNotes();
  return h+renderHabits();
}

/* ---- habits ---- */
function lastDays(today,n){var a=[];for(var i=0;i<n;i++)a.push(addDays(today,-i));return a;}
function habitRow(h,today){
  var st=habitStats(h,today),on=st.doneToday;
  var meta=st.current>0?'سلسلة '+pluDay(st.current):'لم تبدأ السلسلة بعد';
  if(st.current>0&&!on)meta+=' · سجّل اليوم لتحافظ عليها';
  var dots=lastDays(today,7).map(function(d){return '<i'+(h.log[d]?' class="on"':'')+'></i>';}).join('');
  return '<div class="hrow"><button type="button" class="check" role="checkbox" aria-checked="'+on+'" aria-label="تسجيل إنجاز اليوم: '+esc(h.name)+'" data-act="habit-toggle" data-id="'+esc(h.id)+'">'+(on?icon('check'):'')+'</button>'+
    '<button type="button" class="hmain" data-act="habit-open" data-id="'+esc(h.id)+'"><span class="hname">'+esc(h.name)+'</span><span class="hmeta">'+icon('flame')+'<span>'+esc(meta)+'</span></span><span class="dots" aria-hidden="true">'+dots+'</span></button></div>';
}
function renderHabits(){
  var today=todayStr();
  if(!S.habits.length){
    return '<section class="empty"><div>'+icon('flame')+'</div><h2>ابنِ عاداتك</h2><p>تابع عاداتك اليومية وسلاسل التزامك، مثل الرياضة والقراءة والادخار والصلاة في وقتها.</p>'+
      '<div class="actions"><button type="button" class="btn gold" data-act="habit-presets">'+icon('plus')+'أضف العادات المقترحة</button><button type="button" class="btn ghost" data-act="habit-new">عادة بحسب اختيارك</button></div></section>';
  }
  var done=S.habits.filter(function(x){return x.log[today];}).length;
  return '<section aria-labelledby="g-hb"><div class="sec-head"><h2 id="g-hb">عادات اليوم<span class="count">'+done+' من '+S.habits.length+'</span></h2></div>'+
    '<div class="ledger">'+S.habits.map(function(x){return habitRow(x,today);}).join('')+'</div></section>';
}
function addPresetHabits(){
  var have=S.habits.map(function(h){return normSearch(h.name);}),added=0;
  HABIT_PRESETS.forEach(function(n){
    if(have.indexOf(normSearch(n))!==-1||S.habits.length>=CAPS.habits)return;
    var h=normHabit({name:n});
    if(h){S.habits.push(h);added++;}
  });
  if(!added){toast('العادات المقترحة موجودة لديك بالفعل');return;}
  save();
  toast(added===1?'أُضيفت عادة واحدة':'أُضيفت '+added+' عادات');
}
function toggleHabitDay(id,day){
  var h=getItem('habits',id);
  if(!h||!isDateStr(day)||day>todayStr())return;
  var log=Object.assign({},h.log);
  if(log[day])delete log[day];else log[day]=1;
  upsert('habits',Object.assign({},h,{log:log}));
}
function buildHabitDetail(e){
  var h=getItem('habits',e.id);
  if(!h)return null;
  var today=todayStr(),cm=ymOf(today);
  if(!isYm(e.ym))e.ym=cm;
  var ym=e.ym,p=ym.split('-').map(Number),st=habitStats(h,today);
  var first=new Date(p[0],p[1]-1,1).getDay(),days=new Date(p[0],p[1],0).getDate();
  var out=sheetHead(h.name);
  out+='<div class="stats3"><div><b class="num">'+st.current+'</b><span>السلسلة الحالية</span></div><div><b class="num">'+st.best+'</b><span>أفضل سلسلة</span></div><div><b class="num">'+st.total+'</b><span>إجمالي الأيام</span></div></div>';
  out+='<div class="month-nav" style="margin-top:14px;margin-bottom:0"><button type="button" class="icon-btn" data-act="habit-month" data-d="-1" aria-label="الشهر السابق">'+icon('chevR')+'</button>'+
    '<div class="mname" aria-live="polite">'+esc(monthLabel(ym))+'</div>'+
    '<button type="button" class="icon-btn" data-act="habit-month" data-d="1" aria-label="الشهر التالي"'+(ym>=cm?' disabled':'')+'>'+icon('chevL')+'</button></div>';
  out+='<div class="cal">'+CAL_HEAD.map(function(n){return '<span class="cal-h">'+n+'</span>';}).join('');
  for(var i=0;i<first;i++)out+='<span></span>';
  for(var d=1;d<=days;d++){
    var ds=ym+'-'+pad(d),on=!!h.log[ds],fut=ds>today;
    out+='<button type="button" class="'+(on?'on':'')+(ds===today?' today':'')+'" data-act="habit-day" data-id="'+esc(h.id)+'" data-day="'+ds+'" aria-pressed="'+on+'" aria-label="'+esc(fmtDate(ds))+'"'+(fut?' disabled':'')+'>'+d+'</button>';
  }
  out+='</div><p class="hint">اضغط على أي يوم لتسجيله أو إلغائه. الأيام القادمة غير متاحة.</p>';
  out+='<div class="actions mt"><button type="button" class="btn line" data-act="habit-edit" data-id="'+esc(h.id)+'">'+icon('edit')+'تعديل الاسم</button>'+
    '<button type="button" class="btn danger" data-act="habit-del" data-id="'+esc(h.id)+'">'+icon('trash')+'حذف العادة</button></div>';
  return out;
}
function openHabitForm(id){
  var h=id?getItem('habits',id):null;
  if(id&&!h)return;
  openForm({title:h?'تعديل العادة':'عادة جديدة',vals:{name:h?h.name:''},
    fieldsFn:function(v){return [{k:'name',type:'text',label:'اسم العادة',value:v.name,max:60,focus:1,ph:'مثال: المشي نصف ساعة'}];},
    onSubmit:function(v){
      var name=cleanStr(v.name,60);
      if(!name)return {err:'اكتب اسم العادة.',field:'name'};
      var key=normSearch(name);
      if(S.habits.some(function(x){return x.id!==(h&&h.id)&&normSearch(x.name)===key;}))return {err:'لديك عادة بهذا الاسم بالفعل.',field:'name'};
      if(!h&&S.habits.length>=CAPS.habits)return {err:'وصلت إلى الحد الأقصى من العادات.'};
      upsert('habits',normHabit({id:h?h.id:undefined,name:name,log:h?h.log:{},createdAt:h?h.createdAt:undefined}));
    },toast:'تم الحفظ'});
}
function askDeleteHabit(id){
  var h=getItem('habits',id);
  if(!h)return;
  askConfirm({title:'حذف العادة؟',message:'ستُحذف عادة «'+h.name+'» وكل سجلّها نهائيًا ولا يمكن التراجع.',confirmLabel:'نعم، احذف',closeAll:true,onConfirm:function(){removeItem('habits',id);toast('تم حذف العادة');}});

function renderGoals(){
  if(!S.goals.length){
    return '<section class="empty"><div>'+icon('target')+'</div><h2>حدّد أهدافك</h2><p>اكتب هدفًا سنويًا أو شهريًا، وقسّمه إلى خطوات صغيرة، وتابع نسبة الإنجاز.</p>'+

function importSummary(r){
  var parts=KINDS.filter(function(k){return r.counts[k]>0;}).map(function(k){return KIND_NAMES[k]+': '+r.counts[k];});
  if(r.counts.salaries)parts.push('شهريات: '+r.counts.salaries);
  return parts.join('، ');
}
function runImport(){
  var e=topSheet();
  if(!e||e.type!=='import')return;
  var ta=$('#impText'),mr=document.querySelector('input[name="impMode"]:checked');
  e.text=ta?ta.value:e.text;
  e.mode=mr?mr.value:'merge';
  var r=parseBackup(e.text);
  if(r.error){e.err=r.error;renderSheet(false);var f=$('#impText');if(f)f.focus();return;}
  e.err='';
  var replace=e.mode==='replace';
  var msg='ستُستورد هذه البيانات: '+importSummary(r)+'.'+(r.skipped?' وتُجاهل '+r.skipped+' عنصرًا غير صالح.':'')+'\n'+
    (replace?'سيحلّ هذا محلّ كل بياناتك الحالية. تُحفظ نسخة تلقائية من حالتك الحالية يمكن التراجع إليها من الإعدادات.'
            :'سيُضاف هذا إلى بياناتك الحالية دون حذف شيء.');
  askConfirm({title:replace?'استبدال كل البيانات؟':'تأكيد الاستيراد',message:msg,confirmLabel:replace?'نعم، استبدل':'استيراد',danger:replace,closeAll:true,onConfirm:function(){
    savePrev();
    if(replace){
      var ns=r.state;
      if(!r.hasSettings)ns.settings=S.settings;
      S=ns;
    }else S=mergeState(S,r.state);
    ui.fm=ymOf(todayStr());ui.dq='';ui.nq='';ui.dstatus='open';ui.txLimit=60;
    applyTheme();save();
    toast('تم الاستيراد بنجاح');
  }});
}
function readImportFile(input){
  var e=topSheet(),file=input.files&&input.files[0];
  if(!e||e.type!=='import'||!file)return;
  if(file.size>8000000){e.err='الملف كبير جدًا.';renderSheet(false);return;}
  var done=function(text){
    var t=topSheet();
    if(!t||t.type!=='import')return;
    t.text=text;t.err='';renderSheet(false);
  };
  var fail=function(){var t=topSheet();if(t&&t.type==='import'){t.err='تعذّرت قراءة الملف.';renderSheet(false);}};
  if(file.text)file.text().then(done,fail);
  else{var fr=new FileReader();fr.onload=function(){done(String(fr.result||''));};fr.onerror=fail;fr.readAsText(file);}
}

  }).join('');
}
function syncTabs(){
  $$('#tabsIn .tab').forEach(function(b){
    if(b.dataset.tab===ui.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');

}
function fabInfo(){
  if(ui.tab==='fin')return 'عملية جديدة';
  if(ui.tab==='debts')return 'دين جديد';
  if(ui.tab==='tasks')return ui.tk==='appts'?'موعد جديد':'مهمة جديدة';
  if(ui.tab==='grow')return ui.gr==='goals'?'هدف جديد':ui.gr==='notes'?'ملاحظة جديدة':'عادة جديدة';

}
function updateFab(){$('#fab').innerHTML=icon('plus')+'<span>'+fabInfo()+'</span>';}
function fabAction(){
  if(ui.tab==='fin')openTxForm(null,'exp');
  else if(ui.tab==='debts')openDebtForm(null,'in');
  else if(ui.tab==='tasks'){if(ui.tk==='appts')openApptForm();else openTaskForm();}
  else if(ui.tab==='grow'){if(ui.gr==='goals')openGoalForm();else if(ui.gr==='notes')openNoteForm();else openHabitForm();}

function buildQuick(){
  var items=[['q-exp','wallet','مصروف جديد'],['q-inc','cash','دخل جديد'],['q-debt-in','swap','دين لي عند شخص'],['q-debt-out','swap','دين عليّ لشخص'],
    ['q-task','tasks','مهمة جديدة'],['q-appt','calendar','موعد جديد'],['q-habit','flame','عادة جديدة'],['q-goal','target','هدف جديد'],['q-note','note','ملاحظة جديدة']];

/* ---- banners ---- */
function renderBanner(){
  var el=$('#banner'),h='';
  if(loadNote==='corrupt')h+='<div class="banner" role="alert"><p>تعذّرت قراءة البيانات المحفوظة، فبدأ التطبيق فارغًا. حُفظت نسخة من البيانات التالفة على الجهاز ولم تُحذف.</p><button type="button" data-act="banner-hide" data-n="note">حسنًا</button></div>';
  if(loadNote==='migrated')h+='<div class="banner info" role="status"><p>تم نقل ديونك من النسخة القديمة إلى «الحاج» الجديد تلقائيًا ('+S.debts.length+(S.debts.length===1?' دين':' ديون')+').</p><button type="button" data-act="banner-hide" data-n="note">حسنًا</button></div>';
  if(storeMode==='memory')h+='<div class="banner" role="alert"><p>التخزين على هذا المتصفح غير متاح، لذا ستضيع بياناتك عند الإغلاق. صدّر نسخة احتياطية قبل المتابعة.</p><button type="button" data-act="banner-export">تصدير</button></div>';

  if(!ui.hideBackup&&storeMode==='local'&&!ui.updateReady&&countState(S).total>=3&&(n===null||n>=30)){
    h+='<div class="banner info"><p>'+(n===null?'لم تحفظ نسخة احتياطية من بياناتك بعد.':'مرّ '+pluDay(n)+' على آخر نسخة احتياطية.')+'</p><button type="button" data-act="banner-export">تصدير</button><button type="button" data-act="banner-hide" data-n="backup">لاحقًا</button></div>';

/* ---- render ---- */
const RENDERERS={home:renderHome,fin:renderFinance,debts:renderDebts,tasks:renderTasks,grow:renderGrow};
function render(){
  var view=$('#view');
  try{
    view.innerHTML=RENDERERS[ui.tab]();

    view.innerHTML='<section class="empty"><h2>تعذّر عرض هذه الصفحة</h2><p>حدث خطأ غير متوقع، وبياناتك سليمة. جرّب إعادة التحميل، أو صدّر نسخة احتياطية أولًا.</p>'+
      '<div class="actions"><button type="button" class="btn gold" data-act="reload-app">إعادة التحميل</button><button type="button" class="btn ghost" data-act="open-export">تصدير نسخة</button></div></section>';

function goTab(t){
  if(TABS.indexOf(t)===-1)return;

}

/* ---- 90-main.js ---- */
/* ===== events & boot ===== */
function openFrom(fn){closeAllSheets();fn();}
function confirmOk(){
  var e=topSheet();
  if(!e||e.type!=='confirm')return;
  var fn=e.onConfirm;
  if(e.closeAll)closeAllSheets();else closeSheet();
  if(typeof fn==='function'){
    try{fn();}catch(x){console.error(x);toast('حدث خطأ غير متوقع','err');}
  }
}

  go:function(b){goTab(b.dataset.tab);},
  'goto-appts':function(){ui.tk='appts';goTab('tasks');},

  'tx-filter':function(b){ui.ftx=b.dataset.f;ui.txLimit=60;render();},
  'tx-more':function(){ui.txLimit+=60;render();},
  /* debts */
  'debt-new':function(b){openDebtForm(null,b.dataset.dir||'in');},
  'debt-open':function(b){openSheet({type:'debt',id:b.dataset.id});},
  'debt-edit':function(b){openDebtForm(b.dataset.id);},
  addpay:function(b){openPayForm(b.dataset.id,false);},
  payrest:function(b){openPayForm(b.dataset.id,true);},
  remind:function(b){

  },
  delask:function(b){

    if(!d)return;
    askConfirm({title:'حذف الدين؟',message:'سيُحذف دين «'+d.person+'» مع كل دفعاته نهائيًا ولا يمكن التراجع.',confirmLabel:'نعم، احذف',closeAll:true,onConfirm:function(){removeItem('debts',d.id);toast('تم حذف الدين');}});
  },
  delpay:function(b){
    var d=getItem('debts',b.dataset.id),id=b.dataset.id,pid=b.dataset.pid;
    if(!d)return;
    var p=d.payments.filter(function(x){return x.id===pid;})[0];

      var cur=getItem('debts',id);
      if(!cur)return;
      upsert('debts',Object.assign({},cur,{payments:cur.payments.filter(function(x){return x.id!==pid;}),updatedAt:nowIso()}));

  dv:function(b){ui.dv=b.dataset.v;render();},
  dstatus:function(b){ui.dstatus=b.dataset.v;refreshDebtView();},
  dreset:function(){ui.dq='';ui.dstatus='all';render();},
  person:function(b){ui.dv='list';ui.dq=b.dataset.person||'';ui.dstatus='all';render();},
  /* tasks */
  'task-new':function(){openTaskForm(null,'q1');},
  'task-edit':function(b){openTaskForm(b.dataset.id);},
  tasktoggle:function(b){toggleTask(b.dataset.id);},
  'tk-sub':function(b){ui.tk=b.dataset.v;render();},
  'toggle-done':function(){ui.showDone=!ui.showDone;render();},
  'toggle-past':function(){ui.showPast=!ui.showPast;render();},
  'clear-done':function(){
    var n=S.tasks.filter(function(t){return t.done;}).length;
    if(!n)return;
    askConfirm({title:'مسح المهام المنجزة؟',message:'ستُحذف '+n+(n===1?' مهمة منجزة':' مهام منجزة')+' نهائيًا.',confirmLabel:'نعم، امسح',onConfirm:function(){S.tasks=S.tasks.filter(function(t){return !t.done;});save();toast('تم المسح');}});
  },
  'appt-new':function(){openApptForm();},
  'appt-edit':function(b){openApptForm(b.dataset.id);},
  /* growth */
  'gr-sub':function(b){ui.gr=b.dataset.v;render();},
  'habit-presets':function(){addPresetHabits();},
  'habit-new':function(){openHabitForm();},
  'habit-toggle':function(b){toggleHabitDay(b.dataset.id,todayStr());},
  'habit-open':function(b){openSheet({type:'habit',id:b.dataset.id,ym:ymOf(todayStr())});},
  'habit-edit':function(b){openHabitForm(b.dataset.id);},
  'habit-del':function(b){askDeleteHabit(b.dataset.id);},
  'habit-day':function(b){toggleHabitDay(b.dataset.id,b.dataset.day);},
  'habit-month':function(b){
    var e=topSheet();
    if(!e||e.type!=='habit')return;
    var next=addMonths(e.ym||ymOf(todayStr()),Number(b.dataset.d));
    if(next>ymOf(todayStr()))return;
    e.ym=next;renderSheet(false);
  },
  'goal-new':function(){openGoalForm();},
  'goal-edit':function(b){openGoalForm(b.dataset.id);},
  'step-toggle':function(b){updateGoalSteps(b.dataset.id,function(steps){steps.forEach(function(s){if(s.id===b.dataset.sid)s.done=!s.done;});return steps;});},
  'step-del':function(b){updateGoalSteps(b.dataset.id,function(steps){return steps.filter(function(s){return s.id!==b.dataset.sid;});});},
  'note-new':function(){openNoteForm();},
  'note-edit':function(b){openNoteForm(b.dataset.id);},
  'note-pin':function(b){toggleNotePin(b.dataset.id);},
  /* quick add */
  'q-exp':function(){openFrom(function(){openTxForm(null,'exp');});},
  'q-inc':function(){openFrom(function(){openTxForm(null,'inc');});},
  'q-debt-in':function(){openFrom(function(){openDebtForm(null,'in');});},
  'q-debt-out':function(){openFrom(function(){openDebtForm(null,'out');});},
  'q-task':function(){openFrom(function(){openTaskForm(null,'q1');});},
  'q-appt':function(){openFrom(function(){openApptForm();});},
  'q-habit':function(){openFrom(function(){openHabitForm();});},
  'q-goal':function(){openFrom(function(){openGoalForm();});},
  'q-note':function(){openFrom(function(){openNoteForm();});},
  /* settings / data */
  'open-export':function(){syncTopForm();openSheet({type:'export'});},
  'open-import':function(){syncTopForm();openSheet({type:'import',text:'',mode:'merge',err:''});},
  'export-dl':exportJsonDownload,
  'export-copy':exportJsonCopy,
  'csv-debts':exportDebtsCsv,
  'csv-tx':exportTxCsv,
  'import-apply':runImport,
  'wipe-ask':function(){syncTopForm();askWipe();},
  'restore-prev':function(){syncTopForm();askRestorePrev();},
  'banner-hide':function(b){if(b.dataset.n==='note')loadNote='';else ui.hideBackup=true;renderBanner();},
  'banner-export':function(){openSheet({type:'export'});},
  'reload-app':function(){location.reload();}
};
/* refresh only the debts list so the status chips keep their place */
function refreshDebtView(){
  $$('[data-act="dstatus"]').forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.v===ui.dstatus));});
  refreshDebtList();
}
/* controls that re-render the page keep keyboard focus on the equivalent element */
const KEEP_FOCUS=['tasktoggle','habit-toggle','habit-day','habit-month','step-toggle','dv','tk-sub','gr-sub','tx-filter','fm-prev','fm-next','note-pin','toggle-done','toggle-past'];
function focusSelector(b){
  var s='[data-act="'+b.dataset.act+'"]';
  ['id','sid','day','d','v','f','tab'].forEach(function(k){
    if(b.dataset[k]!=null)s+='[data-'+k+'="'+String(b.dataset[k]).replace(/["\\]/g,'')+'"]';
  });
  return s;
}
function handleClick(ev){
  var host=$('#sheetHost');
  if(ev.target===host){closeSheet();return;}
  var b=ev.target.closest?ev.target.closest('[data-act]'):null;
  if(!b||b.disabled)return;
  var fn=ACTIONS[b.dataset.act];
  if(!fn)return;
  var sel=KEEP_FOCUS.indexOf(b.dataset.act)!==-1?focusSelector(b):null;
  try{fn(b,ev);}
  catch(x){console.error(x);toast('حدث خطأ غير متوقع. حاول مرة أخرى.','err');}
  if(sel){
    var el=document.querySelector(sel);
    if(el&&el!==document.activeElement){try{el.focus({preventScroll:true});}catch(x){}}
  }
}
function handleSubmit(ev){
  var f=ev.target;
  if(!f||f.tagName!=='FORM')return;
  if(f.id==='genForm'){ev.preventDefault();submitForm(f);return;}
  var kind=f.dataset.form;
  if(!kind)return;
  ev.preventDefault();
  var inp=f.querySelector('input[type="text"]'),val=inp?inp.value:'',sel;
  if(kind==='qtask'){
    sel='form[data-form="qtask"][data-quad="'+f.dataset.quad+'"] input';
    if(!quickAddTask(val,f.dataset.quad)){toast('اكتب نص المهمة أولًا','warn');if(inp)inp.focus();return;}
  }else if(kind==='qstep'){
    sel='form[data-form="qstep"][data-id="'+String(f.dataset.id).replace(/["\\]/g,'')+'"] input';
    if(!addGoalStep(f.dataset.id,val)){if(!cleanStr(val,120)){toast('اكتب نص الخطوة أولًا','warn');if(inp)inp.focus();}return;}
  }else return;
  var next=document.querySelector(sel);
  if(next)next.focus({preventScroll:true});
}
function handleChange(ev){
  var t=ev.target;
  if(!t||!t.closest)return;
  if(t.dataset&&t.dataset.rr&&t.closest('#genForm')){rerenderForm(t);return;}
  if(t.id==='impFile'){readImportFile(t);return;}
  if(t.name==='impMode'){var e=topSheet();if(e&&e.type==='import')e.mode=t.value;}
}
function handleInput(ev){
  var t=ev.target;
  if(!t)return;
  if(t.id==='dq'){ui.dq=t.value;refreshDebtList();}
  else if(t.id==='nq'){ui.nq=t.value;refreshNoteList();}
  else if(t.id==='impText'){var e=topSheet();if(e&&e.type==='import'){e.text=t.value;e.err='';}}
}
function trapFocus(ev){
  var panel=$('#sheetPanel');
  if(!panel||$('#sheetHost').hidden)return;
  var items=$$('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[href],[tabindex]:not([tabindex="-1"])',panel).filter(function(x){return x.offsetParent!==null||x===document.activeElement;});
  if(!items.length)return;
  var first=items[0],last=items[items.length-1],a=document.activeElement;
  if(!panel.contains(a)){ev.preventDefault();first.focus();return;}
  if(ev.shiftKey&&(a===first||a.id==='sheetTitle')){ev.preventDefault();last.focus();}
  else if(!ev.shiftKey&&a===last){ev.preventDefault();first.focus();}
}
function handleKey(ev){
  if(ui.sheets.length===0)return;
  if(ev.key==='Escape'){ev.preventDefault();closeSheet();}
  else if(ev.key==='Tab')trapFocus(ev);
}

/* ---- housekeeping ---- */
function dayRollover(){
  var t=todayStr();
  if(t===ui.lastDay)return false;
  if(ui.fm===ymOf(ui.lastDay))ui.fm=ymOf(t);
  ui.lastDay=t;
  return true;
}
function typingInView(){
  var a=document.activeElement;
  return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$('#view').contains(a));
}
function tick(){
  var changed=dayRollover();
  if(ui.sheets.some(function(s){return s.type==='form'||s.type==='import';}))return;
  if(typingInView())return;
  if(changed||ui.tab==='home'||(ui.tab==='tasks'&&ui.tk==='appts'))render();
}
function registerSW(){
  if(!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;
  var had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(function(){});
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(had&&!ui.updateReady){ui.updateReady=true;renderBanner();}
    had=true;
  });
}
function boot(){
  loadState();
  applyTheme();
  buildTabs();
  document.addEventListener('click',handleClick);
  document.addEventListener('submit',handleSubmit);
  document.addEventListener('change',handleChange);
  document.addEventListener('input',handleInput);
  document.addEventListener('keydown',handleKey);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)tick();});
  if(darkMq){
    var onMq=function(){if(S.settings.theme==='auto')applyTheme();};
    if(darkMq.addEventListener)darkMq.addEventListener('change',onMq);
    else if(darkMq.addListener)darkMq.addListener(onMq);
  }
  setInterval(tick,30000);
  render();
  persistRequest();
  registerSW();
}
function persistRequest(){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}}
boot();

})();
